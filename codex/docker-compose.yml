services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: consultant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consultant"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "3032:8025"
      - "3033:1025"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/consultant
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      UPLOAD_FOLDER: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3031:3031"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:3031
    depends_on:
      - backend
    ports:
      - "3030:3030"

volumes:
  pgdata:
  uploads:
